<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta property="og:image:alt" content="Amin Hassan - Product Designer Portfolio" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amin Hassan - Product Designer" />
    <meta name="twitter:description" content="here's a look at some of my work!" />
    <meta name="twitter:image" content="https://aminsubki.com/preview-image.jpg" />
    <meta name="twitter:image:alt" content="Amin Hassan - Product Designer Portfolio" />

    <!-- Canonical -->
    <link rel="canonical" href="https://aminsubki.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- The rack's dither reveal samples this poster on its first frame, before
         React has rendered the markup that would otherwise discover it. -->
    <link
      rel="preload"
      as="image"
      href="/shirt-rail/rack-poster.webp"
      fetchpriority="high"
    />

    <style>
      @import url("https://fonts.googleapis.com/css?family=Bricolage+Grotesque:300,800,400,700|Open+Sans:300");
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:wght@400&family=Space+Mono:wght@400;700&display=swap");
    </style>
    <link href="tailwind.css" rel="stylesheet" />

    <!-- Intro styles are inline so the white screen paints before the app bundle. -->
    <style>
      #intro {
        position: fixed;
        z-index: 999;
        inset: 0;
        background: #fff;
        transition: opacity 280ms ease;
      }

      #intro canvas {
        position: absolute;
        z-index: 0;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: auto;
      }

      #intro .intro-message {
        position: absolute;
        z-index: 1;
        top: 50%;
        left: 50%;
        margin: 0;
        color: #000;
        font-family: "Space Mono", monospace;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.01em;
        line-height: 1;
        pointer-events: none;
        transform: translate(-50%, -50%);
        white-space: nowrap;
      }

      #intro.is-rendering {
        background: transparent;
      }

      #intro.is-done {
        opacity: 0;
        pointer-events: none;
      }

      .intro-skip #intro {
        display: none;
      }

      .intro-active,
      .intro-active body {
        overflow: hidden;
      }

      @media (prefers-reduced-motion: reduce) {
        #intro {
          transition: opacity 240ms linear;
        }
      }
    </style>

    <script>
      // Runs before the body is parsed. The intro plays on every homepage load;
      // case-study routes and deep links skip it because they never mount the
      // jersey rack that signals the reveal to finish.
      (function () {
        // Clean up the flag used by the previous once-per-session version.
        try {
          sessionStorage.removeItem("intro-played");
        } catch (error) {
          /* Storage can be unavailable in private browsing. */
        }

        if (
          window.location.pathname !== "/" ||
          (window.location.hash && window.location.hash !== "#top")
        ) {
          document.documentElement.classList.add("intro-skip");
        } else {
          document.documentElement.classList.add("intro-active");
        }
      })();
    </script>
  </head>

  <body>
    <div id="intro" aria-hidden="true">
      <canvas id="intro-noise"></canvas>
      <p class="intro-message">Welcome :)</p>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var overlay = document.getElementById("intro");
        var canvas = document.getElementById("intro-noise");
        var message = overlay
          ? overlay.querySelector(".intro-message")
          : null;
        if (
          !overlay ||
          !canvas ||
          document.documentElement.classList.contains("intro-skip")
        ) {
          return;
        }

        var reduced = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        // One continuous dissolve. Holding at a mid-progress cutoff until the
        // rack was ready made the overlay look frozen whenever textures lagged.
        var DURATION_MS = 4600;
        var SAMPLE_2D = 3;
        var FRAME_MS_2D = 1000 / 24;
        var SOFTNESS = 0.045;
        var start = 0;
        var lastFrame = -Infinity;
        var completed = false;
        var firstFrameDrawn = false;
        var seed = Math.random();
        var glApi = null;
        var context2d = null;
        var image;
        var pixels32;
        var thresholdField;
        var randomState =
          ((Math.random() * 4294967295) >>> 0) || 0x6d2b79f5;

        function finishReveal(delay) {
          if (completed) {
            return;
          }
          completed = true;

          overlay.classList.add("is-done");
          window.setTimeout(function () {
            document.documentElement.classList.remove("intro-active");
            overlay.remove();
          }, delay);
        }

        function announceFirstFrame() {
          if (firstFrameDrawn) {
            return;
          }
          firstFrameDrawn = true;
          overlay.classList.add("is-rendering");
          window.introFirstFrame = true;
          document.dispatchEvent(new CustomEvent("intro-first-frame"));
        }

        function randomGrain() {
          randomState ^= randomState << 13;
          randomState ^= randomState >>> 17;
          randomState ^= randomState << 5;
          return (randomState >>> 0) / 4294967296;
        }

        function smoothstep(edge0, edge1, value) {
          var amount = Math.max(
            0,
            Math.min(1, (value - edge0) / (edge1 - edge0)),
          );
          return amount * amount * (3 - 2 * amount);
        }

        function ease(amount) {
          return amount * amount * (3 - 2 * amount);
        }

        function cutoffFor(progress) {
          return progress * 1.2 - 0.1;
        }

        function fadeMessage(progress) {
          if (!message) {
            return;
          }
          message.style.opacity = String(
            1 - smoothstep(0.24, 0.72, progress),
          );
        }

        function compileShader(gl, type, source) {
          var shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            gl.deleteShader(shader);
            return null;
          }
          return shader;
        }

        function setupGL() {
          var gl = canvas.getContext("webgl", {
            alpha: true,
            premultipliedAlpha: true,
            antialias: false,
            depth: false,
            stencil: false,
            powerPreference: "low-power",
          });
          if (!gl) {
            return null;
          }

          var vertex = compileShader(
            gl,
            gl.VERTEX_SHADER,
            "attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}",
          );
          var fragment = compileShader(
            gl,
            gl.FRAGMENT_SHADER,
            [
              "precision highp float;",
              "uniform float uCutoff;",
              "uniform float uSoft;",
              "uniform float uSeed;",
              "float hash(vec2 p){",
              "  vec3 p3=fract(vec3(p.xyx)*0.1031+uSeed);",
              "  p3+=dot(p3,p3.yzx+33.33);",
              "  return fract((p3.x+p3.y)*p3.z);",
              "}",
              "void main(){",
              "  float n=hash(gl_FragCoord.xy);",
              "  float a=smoothstep(uCutoff-uSoft,uCutoff+uSoft,n);",
              "  gl_FragColor=vec4(a,a,a,a);",
              "}",
            ].join("\n"),
          );
          if (!vertex || !fragment) {
            return null;
          }

          var program = gl.createProgram();
          gl.attachShader(program, vertex);
          gl.attachShader(program, fragment);
          gl.bindAttribLocation(program, 0, "p");
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            return null;
          }

          var buffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
          gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array([-1, -1, 3, -1, -1, 3]),
            gl.STATIC_DRAW,
          );
          gl.useProgram(program);
          gl.enableVertexAttribArray(0);
          gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
          gl.disable(gl.DEPTH_TEST);
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

          return {
            gl: gl,
            cutoff: gl.getUniformLocation(program, "uCutoff"),
            soft: gl.getUniformLocation(program, "uSoft"),
            seed: gl.getUniformLocation(program, "uSeed"),
          };
        }

        function drawGL(api, progress) {
          var gl = api.gl;
          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          var width = Math.max(1, Math.floor(window.innerWidth * dpr));
          var height = Math.max(1, Math.floor(window.innerHeight * dpr));
          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
          }
          gl.viewport(0, 0, width, height);
          gl.uniform1f(api.cutoff, cutoffFor(progress));
          gl.uniform1f(api.soft, SOFTNESS);
          gl.uniform1f(api.seed, seed);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        function resize2D() {
          var width = Math.max(
            1,
            Math.ceil(window.innerWidth / SAMPLE_2D),
          );
          var height = Math.max(
            1,
            Math.ceil(window.innerHeight / SAMPLE_2D),
          );
          if (canvas.width === width && canvas.height === height) {
            return;
          }

          canvas.width = width;
          canvas.height = height;
          image = context2d.createImageData(width, height);
          pixels32 = new Uint32Array(image.data.buffer);
          thresholdField = new Float32Array(width * height);
          for (var i = 0; i < thresholdField.length; i += 1) {
            thresholdField[i] = randomGrain();
          }
        }

        function draw2D(progress) {
          resize2D();
          var cutoff = cutoffFor(progress);
          var count = thresholdField.length;
          for (var i = 0; i < count; i += 1) {
            var alpha =
              smoothstep(
                cutoff - SOFTNESS,
                cutoff + SOFTNESS,
                thresholdField[i],
              ) * 255;
            pixels32[i] = ((alpha << 24) | 0xffffff) >>> 0;
          }
          context2d.putImageData(image, 0, 0);
        }

        function tick(now) {
          if (completed) {
            return;
          }
          if (!start) {
            start = now;
          }

          var progress = ease(
            Math.min(1, (now - start) / DURATION_MS),
          );

          if (glApi) {
            drawGL(glApi, progress);
          } else if (now - lastFrame >= FRAME_MS_2D) {
            lastFrame = now;
            draw2D(progress);
          }

          fadeMessage(progress);
          announceFirstFrame();

          if (progress >= 1) {
            if (glApi) {
              drawGL(glApi, 1);
            } else {
              draw2D(1);
            }
            finishReveal(280);
            return;
          }

          window.requestAnimationFrame(tick);
        }

        if (!reduced) {
          glApi = setupGL();
          if (!glApi) {
            context2d = canvas.getContext("2d");
          }
        }

        if (!reduced && (glApi || context2d)) {
          window.requestAnimationFrame(tick);
        } else {
          window.introFirstFrame = true;
          document.dispatchEvent(new CustomEvent("intro-first-frame"));
          finishReveal(260);
        }

        window.setTimeout(function () {
          if (!completed) {
            finishReveal(280);
          }
        }, 9000);
      })();
    </script>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
