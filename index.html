<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Amin Hassan - Product Designer</title>
    <meta name="description" content="here's a look at some of my work!" />
    <meta name="author" content="Amin Hassan" />

    <!-- Open Graph Meta Tags (Facebook, LinkedIn, etc.) -->
    <meta property="og:site_name" content="Amin Hassan" />
    <meta property="og:title" content="Amin Hassan - Product Designer" />
    <meta property="og:description" content="here's a look at some of my work!" />
    <meta property="og:url" content="https://aminsubki.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://aminsubki.com/preview-image.jpg" />
    <meta property="og:image:secure_url" content="https://aminsubki.com/preview-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Amin Hassan - Product Designer Portfolio" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amin Hassan - Product Designer" />
    <meta name="twitter:description" content="here's a look at some of my work!" />
    <meta name="twitter:image" content="https://aminsubki.com/preview-image.jpg" />
    <meta name="twitter:image:alt" content="Amin Hassan - Product Designer Portfolio" />

    <!-- Canonical -->
    <link rel="canonical" href="https://aminsubki.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- The rack shows this poster while it loads, before React has rendered
         the markup that would otherwise discover it. -->
    <link
      rel="preload"
      as="image"
      href="/shirt-rail/rack-poster.webp"
      fetchpriority="high"
    />

    <style>
      @import url("https://fonts.googleapis.com/css?family=Bricolage+Grotesque:300,800,400,700|Open+Sans:300");
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:wght@400&family=Space+Mono:wght@400;700&display=swap");
    </style>
    <link href="tailwind.css" rel="stylesheet" />

    <!-- Intro styles are inline so the white screen paints before the app bundle. -->
    <style>
      /* The large viewport height still covers the page when mobile toolbars collapse. */
      #intro {
        position: fixed;
        z-index: 999;
        top: 0;
        right: 0;
        left: 0;
        height: 100vh;
        height: 100lvh;
        background: #fff;
        transition: opacity 400ms ease;
      }

      /* The page keeps laying out and the rack keeps rendering, but nothing
         can be seen around or through the overlay until the rack is ready. */
      .intro-active #app {
        visibility: hidden;
      }

      /* Opacity animations run on the compositor, so the pulse stays smooth
         while the rack build blocks the main thread. */
      @keyframes intro-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      #intro .intro-message {
        position: absolute;
        top: 50%;
        left: 50%;
        margin: 0;
        color: #000;
        font-family: "Space Mono", monospace;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.01em;
        line-height: 1;
        pointer-events: none;
        transform: translate(-50%, -50%);
        white-space: nowrap;
        animation: intro-pulse 1.6s ease-in-out infinite;
      }

      #intro.is-done {
        opacity: 0;
        pointer-events: none;
      }

      .intro-skip #intro {
        display: none;
      }

      .intro-active,
      .intro-active body {
        overflow: hidden;
      }

      @media (prefers-reduced-motion: reduce) {
        #intro {
          transition: opacity 200ms linear;
        }

        #intro .intro-message {
          animation: none;
        }
      }
    </style>

    <script>
      // Runs before the body is parsed. The intro plays on every homepage load;
      // case-study routes and deep links skip it because they never mount the
      // jersey rack that signals the reveal to finish.
      (function () {
        // Clean up the flag used by the previous once-per-session version.
        try {
          sessionStorage.removeItem("intro-played");
        } catch (error) {
          /* Storage can be unavailable in private browsing. */
        }

        if (
          window.location.pathname !== "/" ||
          (window.location.hash && window.location.hash !== "#top")
        ) {
          document.documentElement.classList.add("intro-skip");
        } else {
          document.documentElement.classList.add("intro-active");
        }
      })();
    </script>
  </head>

  <body>
    <div id="intro" aria-hidden="true">
      <p class="intro-message">Welcome :)</p>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var overlay = document.getElementById("intro");
        if (
          !overlay ||
          document.documentElement.classList.contains("intro-skip")
        ) {
          return;
        }

        // The rack strip fades in over 420ms once it is ready; the overlay
        // waits that out so it never uncovers a half-faded rack.
        var RACK_SETTLE_MS = 450;
        var FADE_FALLBACK_MS = 500;
        var SAFETY_TIMEOUT_MS = 10000;
        var finished = false;

        function finish() {
          if (finished) {
            return;
          }
          finished = true;
          document.removeEventListener("shirt-rail-ready", onRackReady);
          document.documentElement.classList.remove("intro-active");
          overlay.classList.add("is-done");

          var removed = false;
          function remove() {
            if (removed) {
              return;
            }
            removed = true;
            overlay.remove();
            window.introFinished = true;
            document.dispatchEvent(new CustomEvent("intro-finished"));
          }
          overlay.addEventListener("transitionend", remove, { once: true });
          window.setTimeout(remove, FADE_FALLBACK_MS);
        }

        function onRackReady() {
          window.setTimeout(finish, RACK_SETTLE_MS);
        }

        // The rack holds its heavy build until the white screen has painted.
        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(function () {
            window.introFirstFrame = true;
            document.dispatchEvent(new CustomEvent("intro-first-frame"));
          });
        });

        if (window.shirtRailReady) {
          onRackReady();
        } else {
          document.addEventListener("shirt-rail-ready", onRackReady, {
            once: true,
          });
        }

        window.setTimeout(finish, SAFETY_TIMEOUT_MS);
      })();
    </script>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
